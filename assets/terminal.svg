<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200" role="img" aria-label="Terminal showing active projects">
  <rect width="520" height="200" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <circle cx="24" cy="26" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="26" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="26" r="6" fill="#27C93F"/>
  <text x="24" y="92" font-family="'JetBrains Mono',monospace" font-size="15" fill="#00D4AA">$ </text>
  <text x="52" y="92" font-family="'JetBrains Mono',monospace" font-size="15" fill="#C9D1D9" opacity="0">
    <tspan>story_fork — AI diverges, you decide</tspan>
