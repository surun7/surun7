  </text>
  <text x="52" y="92" font-family="'JetBrains Mono',monospace" font-size="15" fill="#C9D1D9" opacity="0">
    <tspan>context_vault — vault: synced</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64;0.68;0.94;0.98;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="124" font-family="'JetBrains Mono',monospace" font-size="15" fill="#3FB950">✓ build --ship</text>
