<svg xmlns="http://www.w3.org/2000/svg" width="800" height="80" viewBox="0 0 800 80" role="img" aria-label="Animated glowing divider">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#00D4AA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00D4AA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="120" y1="40" x2="680" y2="40" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
  <g>
    <circle r="4" fill="#00D4AA">
      <animate attributeName="cx" values="120;680;120" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;40;40" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="10" fill="#00D4AA" opacity="0.15">
      <animate attributeName="cx" values="120;680;120" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;40;40" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#00D4AA">
    <path d="M160 25 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M400 55 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M620 22 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </path>
    <path d="M300 18 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5 z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M520 58 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5 z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
